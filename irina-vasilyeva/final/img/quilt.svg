<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Одна «подушечка» бордовой стёганой текстуры. Узор повторяется плиткой через CSS. -->
  <defs>
    <radialGradient id="body" cx="42%" cy="36%" r="72%">
      <stop offset="0" stop-color="#b3283b"/>
      <stop offset=".45" stop-color="#8c1628"/>
      <stop offset=".8" stop-color="#5f0b19"/>
      <stop offset="1" stop-color="#3a050e"/>
    </radialGradient>
    <radialGradient id="shine" cx="38%" cy="30%" r="34%">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="#2c030a"/>
  <rect x="3" y="3" width="58" height="58" rx="20" fill="url(#body)"/>
  <rect x="3" y="3" width="58" height="58" rx="20" fill="url(#shine)"/>
</svg>
